[project]
# Distribution name on PyPI ("pypomo" was too similar to an existing project).
# The command and the import package remain "pypomo".
name = "pypomodo"
version = "0.3.1"
description = "A terminal-first Pomodoro timer in the Unix tradition, with named timers, routines, and event hooks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrew Davidson", email = "drace.davidson@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
keywords = ["pomodoro", "timer", "countdown", "cli", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/wulfalpha/pypomo"
Issues = "https://github.com/wulfalpha/pypomo/issues"
Changelog = "https://github.com/wulfalpha/pypomo/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["ruff"]

[project.scripts]
pypomo = "pypomo:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pypomo"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
