name: Publish

# Publishes to PyPI (project "pypomodo") when a version tag such as v0.4.0 is pushed.
# Uses trusted publishing: PyPI trusts this workflow file and the "pypi" environment,
# so no API token is stored in the repository.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Test the built wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s tests
          pypomo --version
          pypomo 1s
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pypomodo/
    permissions:
      id-token: write  # Required for trusted publishing.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
